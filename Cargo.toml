[workspace]
resolver = "2"
members = ["crates/*", "modules/*"]

# Versione del FRAMEWORK (SemVer, pre-1.0). Tutti i crate del core la condividono.
# I MODULI hanno versione propria e dichiarano un range di compatibilità col framework.
# Vedi docs/VERSIONING.md.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vpescete/msh_framework"

[workspace.dependencies]
meshble-core = { path = "crates/meshble-core", version = "0.1.0" }
meshble-schema = { path = "crates/meshble-schema", version = "0.1.0" }
meshble-macros = { path = "crates/meshble-macros", version = "0.1.0" }
meshble = { path = "crates/meshble", version = "0.1.0" }
semver = "1"
