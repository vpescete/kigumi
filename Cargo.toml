[workspace]
resolver = "2"
members = ["crates/*", "modules/*", "apps/*"]

# FRAMEWORK version (SemVer, pre-1.0). All core crates share it.
# MODULES have their own version and declare a compatibility range with the framework.
# See docs/VERSIONING.md.
[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vpescete/kigumi"

[workspace.dependencies]
kigumi-core = { path = "crates/kigumi-core", version = "0.1.1" }
kigumi-schema = { path = "crates/kigumi-schema", version = "0.1.1" }
kigumi-db = { path = "crates/kigumi-db", version = "0.1.1" }
kigumi-auth = { path = "crates/kigumi-auth", version = "0.1.1" }
kigumi-config = { path = "crates/kigumi-config", version = "0.1.1" }
kigumi-server = { path = "crates/kigumi-server", version = "0.1.1" }
kigumi-macros = { path = "crates/kigumi-macros", version = "0.1.1" }
kigumi-storage = { path = "crates/kigumi-storage", version = "0.1.1" }
kigumi-test = { path = "crates/kigumi-test", version = "0.1.1" }
kigumi-mcp = { path = "crates/kigumi-mcp", version = "0.1.1" }
kigumi = { path = "crates/kigumi", version = "0.1.1" }
semver = "1"
