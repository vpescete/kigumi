[workspace]
resolver = "2"
members = ["crates/*", "modules/*", "apps/*"]

# FRAMEWORK version (SemVer, pre-1.0). All core crates share it.
# MODULES have their own version and declare a compatibility range with the framework.
# See docs/VERSIONING.md.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vpescete/msh_framework"

[workspace.dependencies]
meshble-core = { path = "crates/meshble-core", version = "0.1.0" }
meshble-schema = { path = "crates/meshble-schema", version = "0.1.0" }
meshble-db = { path = "crates/meshble-db", version = "0.1.0" }
meshble-auth = { path = "crates/meshble-auth", version = "0.1.0" }
meshble-server = { path = "crates/meshble-server", version = "0.1.0" }
meshble-macros = { path = "crates/meshble-macros", version = "0.1.0" }
meshble = { path = "crates/meshble", version = "0.1.0" }
semver = "1"
