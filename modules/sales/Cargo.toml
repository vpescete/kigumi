[package]
name = "meshble-mod-sales"
description = "Example Meshble module: sale.order + sale_margin extension"
# MODULE version, independent of the framework (see docs/VERSIONING.md).
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
meshble = { workspace = true }
# Module dependency mirrors the manifest `depends` (base). Keeping Cargo deps and
# manifest deps aligned is intentional — a future lint can enforce the match.
meshble-mod-base = { path = "../base", version = "1.0.0" }
