[package]
name = "meshble-mod-sales"
description = "Example Meshble module: sale.order + sale_margin extension"
# MODULE version, independent of the framework (see docs/VERSIONING.md).
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
meshble = { workspace = true }
# Exact-money arithmetic in the line/tax compute functions (discount + tax factors).
rust_decimal = "1"
# The quotation report render fn reads the record JSON (find_one_secured's shape).
serde_json = "1"
# Bespoke READ SQL the secured/domain finds can't express (pricelist most-specific-rule, category
# ancestry) runs on the pool handed out by ServiceCtx::pool(). Matches meshble-db's sqlx config.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "rust_decimal"] }
# Module dependency mirrors the manifest `depends` (base, mail). Keeping Cargo deps and
# manifest deps aligned is intentional — a future lint can enforce the match.
meshble-mod-base = { path = "../base", version = "1.0.0" }
# sale.order opts into the mail subsystem (chatter), so sales depends on mail.
meshble-mod-mail = { path = "../mail", version = "1.0.0" }

[dev-dependencies]
# Quote-to-order integration test exercises the models against a real database.
meshble-db = { workspace = true }
# Named in the test's link anchor so mail's inventory (manifest) is present in the test binary.
meshble-mod-mail = { path = "../mail", version = "1.0.0" }
# The invoicing test links account so account.move / account.account are registered in the binary.
meshble-mod-account = { path = "../account", version = "1.0.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
