[package]
name = "kigumi-mod-base"
description = "Kigumi base module: foundational models (res.partner, res.currency)"
# MODULE version, independent of the framework (see docs/VERSIONING.md).
version = "2.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kigumi = { workspace = true }
# Seed payloads (insert_secured takes JSON maps).
serde_json = "1"

[dev-dependencies]
# res.users/res.groups projection test against a real database.
kigumi-db = { workspace = true }
kigumi-auth = { workspace = true }
# Test kit: DATABASE_URL skip, fingerprinted reset, su()/ins() fixtures (path-only; publish strips it).
kigumi-test = { path = "../../crates/kigumi-test" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
