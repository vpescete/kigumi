[package]
name = "kigumi-mod-base"
description = "Kigumi base module: foundational models (res.partner, res.currency)"
# MODULE version, independent of the framework (see docs/VERSIONING.md).
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kigumi = { workspace = true }

[dev-dependencies]
# res.users/res.groups projection test against a real database.
kigumi-db = { workspace = true }
kigumi-auth = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
