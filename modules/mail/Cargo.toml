[package]
name = "kigumi-mod-mail"
description = "Kigumi mail module: headless chatter — messages, tracking, followers, activities"
# MODULE version, independent of the framework (see docs/VERSIONING.md).
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kigumi = { workspace = true }
# Depends on base for res.users (message author / activity assignee).
kigumi-mod-base = { path = "../base", version = "1.0.0" }

[dev-dependencies]
kigumi-db = { workspace = true }
kigumi-auth = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
