[package]
name = "kigumi-mod-account"
description = "Kigumi account module: double-entry general ledger (account/journal/move)"
# MODULE version, independent of the framework (see docs/VERSIONING.md).
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kigumi = { workspace = true }
# Exact-money arithmetic in the line balance / move totals.
rust_decimal = "1"
# JSON move/line payloads + report rows built by the invoicing/payment services.
serde_json = "1"
# Bespoke READ SQL + engine-owned writes (FX rates, company currency, residual draw-down) the
# domain-based secured finds cannot express, run on the pool ServiceCtx hands out. Matches kigumi-db.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "rust_decimal"] }
# Depends on base for res.currency / res.partner / res.company.
kigumi-mod-base = { path = "../base", version = "1.0.0" }
# account.move opts into the mail subsystem (chatter audit trail), so account depends on mail.
kigumi-mod-mail = { path = "../mail", version = "1.0.0" }

[dev-dependencies]
kigumi-db = { workspace = true }
kigumi-mod-mail = { path = "../mail", version = "1.0.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
