[package]
name = "meshble-mod-account"
description = "Meshble account module: double-entry general ledger (account/journal/move)"
# MODULE version, independent of the framework (see docs/VERSIONING.md).
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
meshble = { workspace = true }
# Exact-money arithmetic in the line balance / move totals.
rust_decimal = "1"
# Depends on base for res.currency / res.partner / res.company.
meshble-mod-base = { path = "../base", version = "1.0.0" }
# account.move opts into the mail subsystem (chatter audit trail), so account depends on mail.
meshble-mod-mail = { path = "../mail", version = "1.0.0" }

[dev-dependencies]
meshble-db = { workspace = true }
meshble-mod-mail = { path = "../mail", version = "1.0.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
