[package]
name = "meshble-cli"
description = "Meshble instance CLI: serve, migrate, config, user management"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "meshble"
path = "src/main.rs"

[dependencies]
meshble = { workspace = true }
meshble-config = { workspace = true }
meshble-db = { workspace = true }
meshble-server = { workspace = true }
meshble-auth = { workspace = true }
meshble-storage = { workspace = true }
# Linked so their models/ACLs/rules self-register into the catalog (inventory).
meshble-mod-base = { path = "../../modules/base" }
meshble-mod-mail = { path = "../../modules/mail" }
meshble-mod-sales = { path = "../../modules/sales" }
meshble-mod-account = { path = "../../modules/account" }
meshble-mod-stock = { path = "../../modules/stock" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "ring"] }
