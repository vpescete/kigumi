[package]
name = "kigumi-renderer-demo"
description = "Runnable demo: migrates a model, serves the headless API + the reference renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
kigumi = { workspace = true }
kigumi-db = { workspace = true }
kigumi-server = { workspace = true }
kigumi-auth = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde_json = "1"
