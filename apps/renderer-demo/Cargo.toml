[package]
name = "meshble-renderer-demo"
description = "Runnable demo: migrates a model, serves the headless API + the reference renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
meshble = { workspace = true }
meshble-db = { workspace = true }
meshble-server = { workspace = true }
meshble-auth = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde_json = "1"
