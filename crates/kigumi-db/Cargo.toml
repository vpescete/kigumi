[package]
name = "kigumi-db"
description = "Postgres persistence: run generated DDL and execute domain-compiled parameterized queries"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kigumi-core = { workspace = true }
kigumi-schema = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "rust_decimal"] }
serde_json = "1"
semver = { workspace = true }
rust_decimal = "1"
# Battle-tested allowlist HTML sanitizer (strips scripts / handlers / javascript: URLs) for Html fields.
ammonia = "4"

# RouteInput::verify_hmac_sha256 — the safe default for webhook receivers (constant-time verify).
hmac = "0.12"
sha2 = "0.10"
# catch_unwind on job bodies: a panicking module job is a failure, not a dead runner task.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
kigumi-test = { path = "../kigumi-test" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
