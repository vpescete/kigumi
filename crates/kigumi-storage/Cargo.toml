[package]
name = "kigumi-storage"
description = "Content-addressed blob storage (sha256-keyed, deduplicated, immutable) behind a trait"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
tempfile = "3"
