[package]
name = "kigumi-auth"
description = "Authentication: verify a signed (HS256 JWT) bearer token into a trusted Ctx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kigumi-core = { workspace = true }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
