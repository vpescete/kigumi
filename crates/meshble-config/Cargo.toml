[package]
name = "meshble-config"
description = "Typed, layered instance configuration (defaults < meshble.toml < env), validated fail-fast; secrets from env only"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
url = "2"
thiserror = "1"

[[bin]]
name = "meshble-config"
path = "src/bin/meshble_config.rs"
