[package]
name = "kigumi"
description = "Kigumi framework facade: prelude re-exporting core, schema and macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kigumi-core = { workspace = true }
kigumi-schema = { workspace = true }
kigumi-macros = { workspace = true }
# The cross-record service seam (register_service!) is DB-typed (ServiceCtx threads secured CRUD), so it
# lives in kigumi-db; the facade re-exports it so modules declare services through the one prelude.
kigumi-db = { workspace = true }
