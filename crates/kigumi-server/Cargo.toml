[package]
name = "kigumi-server"
description = "Headless HTTP server (axum): serves the OpenAPI spec, model list, and UI contracts from a model set"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kigumi-core = { workspace = true }
kigumi-schema = { workspace = true }
kigumi-db = { workspace = true }
kigumi-auth = { workspace = true }
kigumi-storage = { workspace = true }
axum = "0.7"
# The live event stream: a shared outbox poller task + a broadcast channel + the SSE generator.
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
async-stream = "0.3"
serde_json = "1"
rust_decimal = "1"
genpdf = "0.2"
# Observability: a per-request span (method/path/status/latency) via TraceLayer, and a subscriber
# init driven by [log]. Metadata only — never request/response bodies.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["trace"] }
# SSO / OpenID Connect: the protocol (discovery, JWKS, PKCE, nonce, id_token verification) — never
# hand-rolled. rustls, not native-tls, to avoid a system OpenSSL dependency.
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "rust_decimal"] }
tempfile = "3"
# The module-route test generates a real HMAC-SHA256 signature over the raw body and registers a
# route through the facade macro (exercising its expansion).
sha2 = "0.10"
hmac = "0.12"
kigumi = { workspace = true }
kigumi-test = { path = "../kigumi-test" }
